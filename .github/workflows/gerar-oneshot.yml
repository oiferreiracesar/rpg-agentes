name: Gerar Oneshot de RPG

on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'Descreva a aventura que você quer (gênero, tom, gancho, duração)'
        required: true
        type: string

jobs:
  gerar-aventura:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Prepara pasta de saída e salva o pedido do usuário
        run: |
          mkdir -p output
          echo "${{ inputs.brief }}" > output/00-brief.txt

      - name: 1. Roteirista
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia também .github/agents/referencia-swade.md antes de gerar qualquer coisa.
            Leia suas instruções de sistema no arquivo .github/agents/01-roteirista.md
            e siga-as rigorosamente.
            O pedido do usuário está em output/00-brief.txt.
            Gere o JSON pedido e salve em output/01-roteirista.json.

      - name: 2. Direção de Arte
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia suas instruções de sistema no arquivo .github/agents/02-direcao-arte.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json como entrada.
            Gere o JSON pedido e salve em output/02-direcao-arte.json.

      - name: 3. NPCs
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia também .github/agents/referencia-swade.md antes de gerar qualquer coisa.
            Leia suas instruções de sistema no arquivo .github/agents/03-npcs.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json e output/02-direcao-arte.json como entrada.
            Gere o JSON pedido e salve em output/03-npcs.json.

      - name: 4. Cartógrafo
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5"
          prompt: |
            Leia suas instruções de sistema no arquivo .github/agents/04-cartografo.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json e output/02-direcao-arte.json como entrada.
            Gere o JSON pedido e salve em output/04-cartografo.json.

      - name: 5. Sonoplastia
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia suas instruções de sistema no arquivo .github/agents/05-sonoplastia.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json e output/02-direcao-arte.json como entrada.
            Gere o JSON pedido e salve em output/05-sonoplastia.json.

      - name: 6. Documentos
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia suas instruções de sistema no arquivo .github/agents/06-documentos.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json, output/02-direcao-arte.json e
            output/04-cartografo.json como entrada.
            Gere o JSON pedido e salve em output/06-documentos.json.
            
      - name: Configura acesso ao Notion via MCP
        run: |
          mkdir -p ~/.gemini
          cat > ~/.gemini/settings.json << 'EOF'
          {
            "mcpServers": {
              "notion": {
                "command": "npx",
                "args": ["-y", "@notionhq/notion-mcp-server"],
                "env": { "NOTION_TOKEN": "${{ secrets.NOTION_TOKEN }}" }
              }
            }
          }
          EOF
          
      - name: 7. Compilador
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash
          settings: |-
            {
              "mcpServers": {
                "notion": {
                  "command": "npx",
                  "args": ["-y", "@notionhq/notion-mcp-server"],
                  "env": { "NOTION_TOKEN": "${NOTION_TOKEN}" }
                }
              }
            }
          prompt: |
            Leia também .github/agents/referencia-swade.md antes de gerar qualquer coisa.
            Leia suas instruções de sistema no arquivo .github/agents/07-compilador.md
            e siga-as rigorosamente.
            Leia todos os arquivos output/01 até output/06 (se existirem) como entrada.
            Gere o documento pedido e salve em output/07-compilado.md.
            Depois de salvar, use as ferramentas do Notion disponíveis para você (MCP)
            para publicar esse mesmo conteúdo no Notion. O ID da página-mãe está
            disponível na variável de ambiente NOTION_PARENT_PAGE_ID. Siga as
            instruções de publicação descritas no final do arquivo 07-compilador.md.

      - name: Disponibiliza os JSONs gerados para download
        uses: actions/upload-artifact@v4
        with:
          name: oneshot-gerada
          path: output/
          retention-days: 30
