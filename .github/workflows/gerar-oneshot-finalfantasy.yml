name: Gerar Oneshot de Final Fantasy

on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'Descreva a aventura de Final Fantasy que você quer (tom, gancho, vilão, duração)'
        required: true
        type: string
      jogo_referencia:
        description: 'Jogo de referência (define o mundo inteiro da aventura)'
        required: true
        type: choice
        default: 'sem_preferencia'
        options:
          - final_fantasy_i
          - final_fantasy_ii
          - final_fantasy_iii
          - final_fantasy_iv
          - final_fantasy_v
          - final_fantasy_vi
          - final_fantasy_vii
          - final_fantasy_viii
          - final_fantasy_ix
          - final_fantasy_x
          - final_fantasy_x_2
          - final_fantasy_xii
          - final_fantasy_xiii
          - final_fantasy_xv
          - final_fantasy_xvi
          - final_fantasy_xiv
          - sem_preferencia
      momento_temporal:
        description: 'Quando a história se passa, em relação ao jogo escolhido'
        required: true
        type: choice
        default: 'sem_preferencia'
        options:
          - antes_dos_eventos
          - durante_os_eventos
          - depois_dos_eventos
          - sem_preferencia

jobs:
  gerar-aventura-ff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Prepara pasta de saída e salva o pedido do usuário
        run: |
          mkdir -p output
          echo "${{ inputs.brief }}" > output/00-brief.txt
          echo "${{ inputs.jogo_referencia }}" > output/00-jogo-referencia.txt
          echo "${{ inputs.momento_temporal }}" > output/00-momento-temporal.txt

      - name: 1. Roteirista
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia também .github/agents/referencia-swade.md e
            .github/agents/referencia-finalfantasy.md antes de gerar qualquer coisa.
            O jogo de referência está em output/00-jogo-referencia.txt e o
            momento temporal está em output/00-momento-temporal.txt — use as
            seções correspondentes do referencia-finalfantasy.md. Lembre-se de
            que cada jogo define um mundo PRÓPRIO — nunca misture elementos de
            jogos diferentes na mesma aventura.
            SIGA RIGOROSAMENTE a "Referência estrutural obrigatória" — os 6
            blocos e suas proporções de tempo não são sugestão, são requisito.
            Leia suas instruções de sistema no arquivo .github/agents/01-roteirista.md
            e siga-as rigorosamente, restringindo-se ao universo escolhido.
            O pedido do usuário está em output/00-brief.txt.
            Gere o JSON pedido e salve em output/01-roteirista.json.

      - name: 2. Direção de Arte
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia também .github/agents/referencia-finalfantasy.md antes de gerar qualquer coisa.
            Leia suas instruções de sistema no arquivo .github/agents/02-direcao-arte.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json como entrada.
            Gere o JSON pedido e salve em output/02-direcao-arte.json.

      - name: 3. NPCs
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia também .github/agents/referencia-swade.md e
            .github/agents/referencia-finalfantasy.md antes de gerar qualquer coisa.
            Leia suas instruções de sistema no arquivo .github/agents/03-npcs.md
            e siga-as rigorosamente. Ao definir Perícia-Chave de NPCs
            combatentes ligados a um Job clássico, use a tabela de Jobs do
            referencia-finalfantasy.md como referência de sabor mecânico.
            Leia output/01-roteirista.json e output/02-direcao-arte.json como entrada.
            Gere o JSON pedido e salve em output/03-npcs.json.

      - name: 3b. Corrigir Resistência (fórmula, sem IA)
        run: python3 .github/scripts/corrigir_resistencia.py

      - name: 4. Cartógrafo
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia também .github/agents/referencia-finalfantasy.md antes de gerar qualquer coisa.
            Leia suas instruções de sistema no arquivo .github/agents/04-cartografo.md
            e siga-as rigorosamente. Prefira estruturas de dungeon com 3-5
            partes internas, conforme referencia-finalfantasy.md.
            Leia output/01-roteirista.json e output/02-direcao-arte.json como entrada.
            Gere o JSON pedido e salve em output/04-cartografo.json.

      - name: 4c. Animador de Cutscenes
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia suas instruções de sistema no arquivo .github/agents/08-animador.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json, output/03-npcs.json e
            output/04-cartografo.json como entrada.
            Gere o JSON pedido e salve em output/08-animador.json.

      - name: 4d. Tabela de Improviso
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia suas instruções de sistema no arquivo .github/agents/09-improviso.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json e output/03-npcs.json como entrada.
            Gere o JSON pedido e salve em output/09-improviso.json.

      - name: 4e. Diretor de Dinâmicas Físicas
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia também .github/agents/referencia-finalfantasy.md antes de gerar qualquer coisa.
            Leia suas instruções de sistema no arquivo .github/agents/10-puzzles.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json e output/02-direcao-arte.json como entrada.
            Gere o JSON pedido e salve em output/10-puzzles.json.

      - name: 4f. Montar e verificar caça-palavras (algoritmo, sem IA)
        run: python3 .github/scripts/gerar_caca_palavras.py

      - name: 5. Sonoplastia
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia suas instruções de sistema no arquivo .github/agents/05-sonoplastia.md
            e siga-as rigorosamente. Prefira trilhas orquestrais dramáticas e
            temas de fantasia épica melancólica, condizentes com Final Fantasy.
            Leia output/01-roteirista.json e output/02-direcao-arte.json como entrada.
            Gere o JSON pedido e salve em output/05-sonoplastia.json.

      - name: 6. Documentos
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Leia suas instruções de sistema no arquivo .github/agents/06-documentos.md
            e siga-as rigorosamente.
            Leia output/01-roteirista.json, output/02-direcao-arte.json e
            output/04-cartografo.json como entrada.
            Gere o JSON pedido e salve em output/06-documentos.json.

      - name: Validar JSONs (sem IA)
        run: python3 .github/scripts/validar_json.py

      - name: Configura acesso ao Notion via MCP
        run: |
          mkdir -p ~/.gemini
          cat > ~/.gemini/settings.json << 'EOF'
          {
            "mcpServers": {
              "notion": {
                "command": "npx",
                "args": ["-y", "@notionhq/notion-mcp-server"],
                "env": { "NOTION_TOKEN": "${{ secrets.NOTION_TOKEN }}" }
              }
            }
          }
          EOF

      - name: 7a. Compilador — gerar markdown
        run: python3 .github/scripts/compilador_gerar.py

      - name: 7b. Compilador — publicar no Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: python3 .github/scripts/publicar_notion.py

      - name: Disponibiliza os JSONs gerados para download
        uses: actions/upload-artifact@v4
        with:
          name: oneshot-finalfantasy-gerada
          path: output/
          retention-days: 30
